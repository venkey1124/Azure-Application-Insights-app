spring.application.name=student-erp
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_erp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.announcements.url=${ANNOUNCEMENTS_API_URL:https://jsonplaceholder.typicode.com/posts?_limit=5}
app.test.slow-delay-ms=${SLOW_DELAY_MS:3000}
app.marks.db-delay-ms=${MARKS_DB_DELAY_MS:3000}
