<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ERP | Sign in</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-page">
        <section class="login-hero" aria-label="Student ERP overview">
            <p class="eyebrow">Academic command center</p>
            <h1>Student ERP</h1>
            <p>One elegant workspace for academics, attendance, notices, and student records.</p>
            <div class="login-highlights">
                <span>Live profile</span>
                <span>Marks tracker</span>
                <span>Attendance view</span>
            </div>
        </section>

        <section class="login-box">
            <div class="form-heading">
                <p class="eyebrow">Secure access</p>
                <h2>Welcome back</h2>
                <p>Sign in to continue to your student portal.</p>
            </div>
            <form id="loginForm">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="primary-action">Login</button>
            </form>
            <p id="loginMessage" class="message"></p>
            <p class="hint">Demo access: ananya / pass123</p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
